name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (e.g. self-hosted or ubuntu-latest)'
        required: false
        default: 'self-hosted'

jobs:
  deploy:
    name: Deploy Routing Worker to Cloudflare
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'self-hosted' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Deploy Worker via pnpm
        run: pnpm --prefix worker deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
